# =============================================================================
# German Newsfeed MCP Server — Docker Compose
#
# Usage:
#   docker compose up           # start in foreground
#   docker compose up -d        # start in background
#   docker compose logs -f      # follow logs
#   docker compose down         # stop & remove containers
#
# The server will be available at:
#   http://localhost:8000/mcp   (MCP Streamable HTTP endpoint)
# =============================================================================

services:
  german-newsfeed-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: german-newsfeed-mcp:latest
    container_name: german-newsfeed-mcp

    # Load overrides from .env (copy .env.example → .env first)
    env_file:
      - .env

    environment:
      TRANSPORT: streamable-http
      HOST: 0.0.0.0
      PORT: "8000"
      LOG_LEVEL: INFO

    # Deliberately bound to loopback only — the HTTP transport has no
    # authentication. If you expose this externally, put an authenticating
    # reverse proxy in front.
    ports:
      - "127.0.0.1:8000:8000"

    # Restart policy — sensible default for production
    restart: unless-stopped

    # Resource limits — adjust for your host
    deploy:
      # Hard-pinned to 1. The rate limiter (rate_limiter.py) is an in-memory
      # token bucket, local to this single process. It is NOT shared across
      # replicas or persisted across restarts. Running more than one replica
      # multiplies the effective request budget against the upstream API and
      # silently breaks the 60/h contract documented in the README. Do not
      # raise this without first moving the limiter to shared state (e.g.
      # Redis)
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

    # Health check follows the PORT env var so an overridden port does not
    # leave the container permanently unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, httpx; httpx.get('http://localhost:' + os.environ.get('PORT', '8000') + '/mcp', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Mount logs directory for persistent log access (optional)
    # volumes:
    #   - ./logs:/app/logs
