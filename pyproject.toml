[project]
name = "german-newsfeed-mcp"
version = "1.0.0"
description = "MCP server for the public news API of tagesschau.de, including regional news from the ARD"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Isabell Lorenzo-Reichardt", email = "isabell@i22y.de" }
]
requires-python = ">=3.12"
keywords = ["mcp", "mcp-server", "news", "tagesschau", "german-news", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upper bounds: FastMCP is under active development — a major-version
    # jump must not hit users unasked.
    "fastmcp>=3.2.4,<4",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage    = "https://github.com/Jakolo121/german-newsfeed-mcp"
Repository  = "https://github.com/Jakolo121/german-newsfeed-mcp"
Issues      = "https://github.com/Jakolo121/german-newsfeed-mcp/issues"
Changelog   = "https://github.com/Jakolo121/german-newsfeed-mcp/blob/main/CHANGELOG.md"

[project.scripts]
german-newsfeed-mcp = "german_newsfeed_mcp.server:run"

[project.optional-dependencies]
dev = [
    "anyio>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pylint>=3.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put src/ on sys.path so tests can import german_newsfeed_mcp without installing
pythonpath = ["src"]
# Show locals on failure, verbose output
addopts = "-v --tb=short"
# Register custom markers to suppress warnings
markers = [
    "integration: marks tests that require internet access (run with -m integration)",
]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
]
